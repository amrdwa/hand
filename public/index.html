<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>هاند سعودي - نظام جواكر</title>
  <!-- مكتبة معالجة السحب والانزلاق الاحترافية مثل التطبيقات -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #0b3818; color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; overflow: hidden; touch-action: manipulation; }
    
    .screen { width: 100%; max-width: 650px; padding: 10px; text-align: center; }
    .hidden { display: none !important; }
    
    input, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 10px; border: none; font-weight: bold; font-size: 16px; }
    button { background: #2563eb; color: white; cursor: pointer; }

    .players-box { background: rgba(0,0,0,0.4); padding: 8px; border-radius: 10px; margin: 8px 0; border: 1px solid rgba(255,255,255,0.2); }
    .player-tag { display: inline-block; background: #1e3a8a; padding: 4px 10px; border-radius: 20px; margin: 2px; font-size: 13px; font-weight: bold; }

    .table-area { display: flex; justify-content: center; gap: 30px; margin: 15px 0; align-items: center; }
    .pile { width: 80px; height: 110px; border: 2px dashed rgba(255,255,255,0.4); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; background: rgba(0,0,0,0.3); cursor: pointer; transition: 0.2s; position: relative; }
    .pile.drag-over { border-color: #facc15; background: rgba(250, 204, 21, 0.25); transform: scale(1.05); }

    /* منطقة يد اللاعب - نظام جواكر */
    .hand-container {
      width: 100%;
      background: rgba(0,0,0,0.45);
      border-radius: 20px 20px 0 0;
      padding: 30px 10px 15px 10px;
      min-height: 140px;
      border-top: 2px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .hand-tray {
      display: flex;
      align-items: flex-end;
      min-width: 100%;
      min-height: 100px;
      padding-left: 20px;
    }

    /* تصميم الكرت العائم للتصفط */
    .card {
      width: 52px;
      height: 82px;
      background: #ffffff;
      color: #111;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 5px;
      font-weight: bold;
      font-size: 15px;
      box-shadow: -3px 4px 8px rgba(0,0,0,0.5);
      position: relative;
      border: 1px solid #bbb;
      margin-left: -24px; /* تداخل الكروت مثل جواكر */
      cursor: grab;
      transition: transform 0.1s ease, margin 0.15s ease;
      background-clip: padding-box;
    }

    .card.red { color: #dc2626; }
    
    /* عند حمل الكرت بالسحب */
    .card-ghost {
      opacity: 0.2;
      background: #facc15 !important;
      border: 2px dashed #000;
    }

    .card-chosen {
      transform: translateY(-20px) scale(1.08) !important;
      z-index: 999 !important;
      box-shadow: 0 10px 20px rgba(0,0,0,0.6);
    }

    .status-box { background: rgba(0,0,0,0.6); padding: 8px; border-radius: 8px; font-weight: bold; color: #facc15; margin-bottom: 5px; }
  </style>
</head>
<body>

  <!-- شاشة الدخول -->
  <div class="screen" id="authScreen">
    <h1>🃏 هاند سعودي</h1>
    <input id="pName" type="text" placeholder="اسمك">
    <button id="createBtn">🏠 إنشاء غرفة</button>
    <input id="rCode" type="text" placeholder="كود الغرفة" style="margin-top:15px;">
    <button id="joinBtn" style="background:#059669;">🔑 دخول</button>
  </div>

  <!-- شاشة اللعب -->
  <div class="screen hidden" id="gameScreen">
    <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:5px;">
      <span>غرفة: <span id="roomCodeDisp"></span></span>
      <span>الجولة: <span id="roundDisp">1</span> من 5</span>
    </div>

    <div class="players-box">
      <div id="playersList">...</div>
    </div>

    <div class="status-box" id="turnStatus">بانتظار اكتمال اللاعبين...</div>
    <button id="startBtn" class="hidden" style="background:#f59e0b; color:#000;">🚀 ابدأ اللعبة</button>

    <div id="playArea" class="hidden">
      <!-- طاولة السحب والرمي -->
      <div class="table-area">
        <div class="pile" id="deckPile">
          <div>الكوم</div>
          <div id="deckCount">0</div>
        </div>
        <div class="pile" id="discardPile">
          <div>الساحة</div>
          <div id="discardCard">-</div>
        </div>
      </div>

      <!-- منطقة اليد بالتصفيط الحر -->
      <div class="hand-container">
        <div class="hand-tray" id="handTray"></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myHand = [];
    let roomCode = "";
    let isMyTurnGlobal = false;
    let hasDrawnGlobal = false;
    let sortableHand = null;

    document.getElementById("createBtn").onclick = () => {
      const name = document.getElementById("pName").value.trim();
      if (!name) return alert("ادخل الاسم");
      socket.emit("create-room", { name }, (res) => {
        if (res.success) {
          roomCode = res.code;
          document.getElementById("roomCodeDisp").textContent = roomCode;
          document.getElementById("startBtn").classList.remove("hidden");
          showGame();
        }
      });
    };

    document.getElementById("joinBtn").onclick = () => {
      const name = document.getElementById("pName").value.trim();
      const code = document.getElementById("rCode").value.trim();
      if (!name || !code) return alert("ادخل البيانات");
      socket.emit("join-room", { name, code }, (res) => {
        if (res.success) {
          roomCode = code;
          document.getElementById("roomCodeDisp").textContent = roomCode;
          showGame();
        } else alert(res.message);
      });
    };

    document.getElementById("startBtn").onclick = () => {
      socket.emit("start-game", { code: roomCode });
    };

    function showGame() {
      document.getElementById("authScreen").classList.add("hidden");
      document.getElementById("gameScreen").classList.remove("hidden");
    }

    socket.on("update-players", (players) => {
      document.getElementById("playersList").innerHTML = players.map(p => `<span class="player-tag">👤 ${p.name}</span>`).join("");
    });

    socket.on("your-hand", (hand) => {
      myHand = hand;
      renderHand();
    });

    socket.on("game-state", (state) => {
      document.getElementById("roundDisp").textContent = state.round;
      document.getElementById("deckCount").textContent = state.deckCount;
      document.getElementById("startBtn").classList.add("hidden");
      document.getElementById("playArea").classList.remove("hidden");

      isMyTurnGlobal = state.turnPlayerId === socket.id;
      hasDrawnGlobal = state.hasDrawn;

      const turnStatus = document.getElementById("turnStatus");

      if (state.discardTop) {
        document.getElementById("discardCard").innerHTML = `<span class="${state.discardTop.color}">${state.discardTop.value}${state.discardTop.suit}</span>`;
      } else {
        document.getElementById("discardCard").textContent = "-";
      }

      if (isMyTurnGlobal) {
        turnStatus.textContent = hasDrawnGlobal ? "🟢 دورك! اسحب الكرت وارمهِ فوق الساحة" : "🟢 دورك! اضغط الكوم أو الساحة للسحب";
      } else {
        turnStatus.textContent = `🔴 دور: ${state.turnPlayerName}`;
      }
    });

    // السحب بالضغط
    document.getElementById("deckPile").onclick = () => {
      if (isMyTurnGlobal && !hasDrawnGlobal) socket.emit("draw-card", { fromDiscard: false });
    };
    document.getElementById("discardPile").onclick = () => {
      if (isMyTurnGlobal && !hasDrawnGlobal) socket.emit("draw-card", { fromDiscard: true });
    };

    // بناء اليد وتفعيل محاكي جواكر للترتيب والسحب
    function renderHand() {
      const tray = document.getElementById("handTray");
      tray.innerHTML = "";

      myHand.forEach((card) => {
        const div = document.createElement("div");
        div.className = `card ${card.color}`;
        div.dataset.id = card.id;
        div.innerHTML = `<div>${card.value}</div><div>${card.suit}</div>`;
        tray.appendChild(div);
      });

      // تفعيل محرك الترتيب باللمس والماوس (Drag & Drop + Reorder)
      if (sortableHand) sortableHand.destroy();

      sortableHand = new Sortable(tray, {
        animation: 200,
        ghostClass: 'card-ghost',
        chosenClass: 'card-chosen',
        dragClass: 'card-chosen',
        fallbackOnBody: true,
        swapThreshold: 0.65,
        onEnd: function (evt) {
          // تحديث ترتيب الكروت في الذاكرة بعد سحبها
          const movedCard = myHand.splice(evt.oldIndex, 1)[0];
          myHand.splice(evt.newIndex, 0, movedCard);

          // إذا تم سحب الكرت وإسقاطه فوق منطقة "الساحة" لرميه
          const discardRect = document.getElementById("discardPile").getBoundingClientRect();
          const touchEvt = evt.originalEvent.changedTouches ? evt.originalEvent.changedTouches[0] : evt.originalEvent;
          const mouseX = touchEvt.clientX;
          const mouseY = touchEvt.clientY;

          if (
            mouseX >= discardRect.left &&
            mouseX <= discardRect.right &&
            mouseY >= discardRect.top &&
            mouseY <= discardRect.bottom
          ) {
            if (isMyTurnGlobal && hasDrawnGlobal) {
              socket.emit("discard-card", { cardId: movedCard.id });
            } else {
              renderHand(); // إرجاع الكرت إذا لم يكن دوره
            }
          }
        }
      });
    }
  </script>
</body>
</html>
