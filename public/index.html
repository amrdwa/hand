<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>هاند سعودي - جواكر</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; user-select: none; }
    body { margin: 0; background: #0b3818; color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; overflow: hidden; }
    .screen { width: 100%; max-width: 600px; padding: 15px; text-align: center; }
    .hidden { display: none !important; }
    
    input, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 10px; border: none; font-weight: bold; font-size: 16px; }
    button { background: #2563eb; color: white; cursor: pointer; }

    .players-box { background: rgba(0,0,0,0.4); padding: 8px; border-radius: 10px; margin: 10px 0; border: 1px solid rgba(255,255,255,0.2); }
    .player-tag { display: inline-block; background: #1e3a8a; padding: 4px 10px; border-radius: 20px; margin: 2px; font-size: 13px; font-weight: bold; }

    .table-area { display: flex; justify-content: center; gap: 20px; margin: 20px 0; align-items: center; }
    .pile { width: 75px; height: 105px; border: 2px dashed rgba(255,255,255,0.4); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; background: rgba(0,0,0,0.3); cursor: pointer; transition: 0.2s; }
    .pile.drag-over { border-color: #facc15; background: rgba(250, 204, 21, 0.2); }

    .card {
      width: 52px; height: 80px; background: #fff; color: #111;
      border-radius: 8px; display: inline-flex; flex-direction: column; justify-content: space-between;
      padding: 4px; font-weight: bold; font-size: 14px; box-shadow: -2px 3px 6px rgba(0,0,0,0.4);
      position: relative; border: 2px solid #ccc; cursor: grab; margin-left: -22px; touch-action: none;
    }
    .card.red { color: #dc2626; }
    .card.dragging { opacity: 0.4; }

    .hand-tray {
      display: flex; justify-content: center; align-items: flex-end;
      padding: 25px 15px 15px 35px; min-height: 130px; overflow-x: auto;
      background: rgba(0,0,0,0.4); border-radius: 20px; width: 100%; margin-top: 10px;
    }

    .btn-hand { background: #000; border: 2px solid #facc15; color: #facc15; margin-bottom: 10px; }
    .status-box { background: rgba(0,0,0,0.5); padding: 8px; border-radius: 8px; font-weight: bold; color: #facc15; margin-bottom: 10px; }
  </style>
</head>
<body>

  <!-- شاشة الدخول -->
  <div class="screen" id="authScreen">
    <h1>🃏 هاند سعودي</h1>
    <input id="pName" type="text" placeholder="اسمك">
    <button id="createBtn">🏠 إنشاء غرفة</button>
    <input id="rCode" type="text" placeholder="كود الغرفة" style="margin-top:15px;">
    <button id="joinBtn" style="background:#059669;">🔑 دخول</button>
  </div>

  <!-- شاشة الانتظار واللعب -->
  <div class="screen hidden" id="gameScreen">
    <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:5px;">
      <span>غرفة: <span id="roomCodeDisp"></span></span>
      <span>الجولة: <span id="roundDisp">1</span> من 5</span>
    </div>

    <div class="players-box">
      <div style="font-size:12px; color:#aaa; margin-bottom:5px;">اللاعبون المتواجدون:</div>
      <div id="playersList">...</div>
    </div>

    <div class="status-box" id="turnStatus">بانتظار اكتمال اللاعبين...</div>
    <button id="startBtn" class="hidden" style="background:#f59e0b; color:#000;">🚀 ابدأ اللعبة</button>

    <div id="playArea" class="hidden">
      <div class="table-area">
        <div class="pile" id="deckPile">
          <div>الكوم</div>
          <div id="deckCount">0</div>
        </div>
        <div class="pile" id="discardPile">
          <div>الساحة</div>
          <div id="discardCard">-</div>
        </div>
      </div>

      <button id="handWinBtn" class="btn-hand hidden">🔥 إنهاء هاند</button>

      <!-- يد اللاعب للترتيب الحر -->
      <div class="hand-tray" id="handTray"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myHand = [];
    let roomCode = "";
    let draggedIndex = null;
    let isMyTurnGlobal = false;
    let hasDrawnGlobal = false;

    document.getElementById("createBtn").onclick = () => {
      const name = document.getElementById("pName").value.trim();
      if (!name) return alert("ادخل الاسم");
      socket.emit("create-room", { name }, (res) => {
        if (res.success) {
          roomCode = res.code;
          document.getElementById("roomCodeDisp").textContent = roomCode;
          document.getElementById("startBtn").classList.remove("hidden");
          showGame();
        }
      });
    };

    document.getElementById("joinBtn").onclick = () => {
      const name = document.getElementById("pName").value.trim();
      const code = document.getElementById("rCode").value.trim();
      if (!name || !code) return alert("ادخل البيانات");
      socket.emit("join-room", { name, code }, (res) => {
        if (res.success) {
          roomCode = code;
          document.getElementById("roomCodeDisp").textContent = roomCode;
          showGame();
        } else alert(res.message);
      });
    };

    document.getElementById("startBtn").onclick = () => {
      socket.emit("start-game", { code: roomCode });
    };

    function showGame() {
      document.getElementById("authScreen").classList.add("hidden");
      document.getElementById("gameScreen").classList.remove("hidden");
    }

    socket.on("update-players", (players) => {
      document.getElementById("playersList").innerHTML = players.map(p => `<span class="player-tag">👤 ${p.name}</span>`).join("");
    });

    socket.on("your-hand", (hand) => {
      myHand = hand;
      renderHand();
    });

    socket.on("game-state", (state) => {
      document.getElementById("roundDisp").textContent = state.round;
      document.getElementById("deckCount").textContent = state.deckCount;
      document.getElementById("startBtn").classList.add("hidden");
      document.getElementById("playArea").classList.remove("hidden");

      isMyTurnGlobal = state.turnPlayerId === socket.id;
      hasDrawnGlobal = state.hasDrawn;

      const turnStatus = document.getElementById("turnStatus");

      if (state.discardTop) {
        document.getElementById("discardCard").innerHTML = `<span class="${state.discardTop.color}">${state.discardTop.value}${state.discardTop.suit}</span>`;
      } else {
        document.getElementById("discardCard").textContent = "-";
      }

      if (isMyTurnGlobal) {
        turnStatus.textContent = hasDrawnGlobal ? "🟢 دورك! اسحب كرت من يدك وارمِه على الساحة" : "🟢 دورك! اضغط على الكوم أو الساحة للسحب";
      } else {
        turnStatus.textContent = `🔴 دور: ${state.turnPlayerName}`;
      }

      document.getElementById("deckPile").onclick = () => {
        if (isMyTurnGlobal && !hasDrawnGlobal) socket.emit("draw-card", { fromDiscard: false });
      };
      document.getElementById("discardPile").onclick = () => {
        if (isMyTurnGlobal && !hasDrawnGlobal) socket.emit("draw-card", { fromDiscard: true });
      };

      const handWinBtn = document.getElementById("handWinBtn");
      if (myHand.length === 14 || myHand.length === 15) {
        handWinBtn.classList.remove("hidden");
      } else {
        handWinBtn.classList.add("hidden");
      }
    });

    function renderHand() {
      const tray = document.getElementById("handTray");
      tray.innerHTML = "";

      myHand.forEach((card, index) => {
        const div = document.createElement("div");
        div.className = `card ${card.color}`;
        div.draggable = true;
        div.dataset.index = index;
        div.innerHTML = `<div>${card.value}</div><div>${card.suit}</div>`;

        // أحداث السحب والترتيب يدويًا
        div.ondragstart = (e) => {
          draggedIndex = index;
          div.classList.add("dragging");
          e.dataTransfer.setData("text/plain", index);
        };

        div.ondragend = () => {
          div.classList.remove("dragging");
        };

        div.ondragover = (e) => e.preventDefault();

        div.ondrop = (e) => {
          e.preventDefault();
          const targetIndex = parseInt(div.dataset.index);
          if (draggedIndex !== null && draggedIndex !== targetIndex) {
            const movedCard = myHand.splice(draggedIndex, 1)[0];
            myHand.splice(targetIndex, 0, movedCard);
            renderHand();
          }
        };

        tray.appendChild(div);
      });
    }

    // إمكانية رمي الكرت بالماوس وإسقاطه في الساحة
    const discardPile = document.getElementById("discardPile");

    discardPile.ondragover = (e) => {
      e.preventDefault();
      discardPile.classList.add("drag-over");
    };

    discardPile.ondragleave = () => {
      discardPile.classList.remove("drag-over");
    };

    discardPile.ondrop = (e) => {
      e.preventDefault();
      discardPile.classList.remove("drag-over");
      if (isMyTurnGlobal && hasDrawnGlobal && draggedIndex !== null) {
        const cardToDiscard = myHand[draggedIndex];
        socket.emit("discard-card", { cardId: cardToDiscard.id });
        draggedIndex = null;
      }
    };

    document.getElementById("handWinBtn").onclick = () => {
      socket.emit("declare-hand-win");
    };

    socket.on("round-ended", (res) => alert(`🎉 انتهت الجولة! الفائز: ${res.winnerName}`));
    socket.on("game-over", () => alert("🏆 انتهت الـ 5 جولات بالكامل!"));
  </script>
</body>
</html>
