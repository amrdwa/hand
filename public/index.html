<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>هاند سعودي - جواكر</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; user-select: none; }
    body { margin: 0; background: #0b3818; color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
    .screen { width: 100%; max-width: 500px; padding: 15px; text-align: center; }
    .hidden { display: none !important; }
    
    input, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 10px; border: none; font-weight: bold; font-size: 16px; }
    button { background: #2563eb; color: white; cursor: pointer; }

    .players-box { background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px; margin: 10px 0; border: 1px solid rgba(255,255,255,0.2); }
    .player-tag { display: inline-block; background: #1e3a8a; padding: 5px 12px; border-radius: 20px; margin: 3px; font-size: 14px; font-weight: bold; }

    .table-area { display: flex; justify-content: center; gap: 20px; margin: 15px 0; align-items: center; }
    .pile { width: 70px; height: 100px; border: 2px dashed rgba(255,255,255,0.4); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; background: rgba(0,0,0,0.3); cursor: pointer; }

    .card {
      width: 54px; height: 82px; background: #fff; color: #111;
      border-radius: 8px; display: inline-flex; flex-direction: column; justify-content: space-between;
      padding: 4px; font-weight: bold; font-size: 14px; box-shadow: -2px 3px 6px rgba(0,0,0,0.4);
      position: relative; border: 2px solid #ccc; transition: transform 0.15s; margin-left: -20px;
    }
    .card.red { color: #dc2626; }
    .card.selected { transform: translateY(-18px); border-color: #facc15 !important; }

    .hand-tray {
      display: flex; justify-content: center; align-items: flex-end;
      padding: 25px 15px 10px 35px; min-height: 130px; overflow-x: auto;
      background: rgba(0,0,0,0.4); border-radius: 20px; width: 100%;
    }

    .btn-discard { background: #dc2626; }
    .btn-hand { background: #000; border: 2px solid #facc15; color: #facc15; }
    .status-box { background: rgba(0,0,0,0.5); padding: 8px; border-radius: 8px; font-weight: bold; color: #facc15; margin-bottom: 10px; }
  </style>
</head>
<body>

  <!-- شاشة الدخول -->
  <div class="screen" id="authScreen">
    <h1>🃏 هاند سعودي</h1>
    <input id="pName" type="text" placeholder="اسمك">
    <button id="createBtn">🏠 إنشاء غرفة</button>
    <input id="rCode" type="text" placeholder="كود الغرفة" style="margin-top:15px;">
    <button id="joinBtn" style="background:#059669;">🔑 دخول</button>
  </div>

  <!-- شاشة الانتظار واللعب -->
  <div class="screen hidden" id="gameScreen">
    <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:5px;">
      <span>غرفة: <span id="roomCodeDisp"></span></span>
      <span>الجولة: <span id="roundDisp">1</span> من 5</span>
    </div>

    <!-- قائمة عرض اللاعبين بالتحديث المباشر -->
    <div class="players-box">
      <div style="font-size:12px; color:#aaa; margin-bottom:5px;">اللاعبون المتواجدون (2-4):</div>
      <div id="playersList">...</div>
    </div>

    <div class="status-box" id="turnStatus">بانتظار اكتمال اللاعبين...</div>
    <button id="startBtn" class="hidden" style="background:#f59e0b; color:#000;">🚀 ابدأ اللعبة</button>

    <div id="playArea" class="hidden">
      <div class="table-area">
        <div class="pile" id="deckPile">
          <div>الكوم</div>
          <div id="deckCount">0</div>
        </div>
        <div class="pile" id="discardPile">
          <div>الساحة</div>
          <div id="discardCard">-</div>
        </div>
      </div>

      <div style="display:flex; gap:5px; margin-bottom:10px;">
        <button id="sortGroupBtn" style="background:#4b5563; font-size:12px;">🧹 تصفيط مجموعات</button>
        <button id="sortRunBtn" style="background:#4b5563; font-size:12px;">🧹 تصفيط متسلسل</button>
      </div>

      <div style="display:flex; gap:5px; margin-bottom:10px;">
        <button id="discardBtn" class="btn-discard hidden">ارَمِ الكرت المحدد</button>
        <button id="handWinBtn" class="btn-hand hidden">🔥 إنهاء هاند</button>
      </div>

      <div class="hand-tray" id="handTray"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myHand = [];
    let selectedCardId = null;
    let roomCode = "";

    document.getElementById("createBtn").onclick = () => {
      const name = document.getElementById("pName").value.trim();
      if (!name) return alert("ادخل الاسم");
      socket.emit("create-room", { name }, (res) => {
        if (res.success) {
          roomCode = res.code;
          document.getElementById("roomCodeDisp").textContent = roomCode;
          document.getElementById("startBtn").classList.remove("hidden");
          showGame();
        }
      });
    };

    document.getElementById("joinBtn").onclick = () => {
      const name = document.getElementById("pName").value.trim();
      const code = document.getElementById("rCode").value.trim();
      if (!name || !code) return alert("ادخل البيانات");
      socket.emit("join-room", { name, code }, (res) => {
        if (res.success) {
          roomCode = code;
          document.getElementById("roomCodeDisp").textContent = roomCode;
          showGame();
        } else alert(res.message);
      });
    };

    document.getElementById("startBtn").onclick = () => {
      socket.emit("start-game", { code: roomCode }, (res) => {
        if (!res.success) alert(res.message);
      });
    };

    function showGame() {
      document.getElementById("authScreen").classList.add("hidden");
      document.getElementById("gameScreen").classList.remove("hidden");
    }

    // تحديث أسماء اللاعبين فور دخول أي شخص
    socket.on("update-players", (players) => {
      const pList = document.getElementById("playersList");
      pList.innerHTML = players.map(p => `<span class="player-tag">👤 ${p.name}</span>`).join("");
    });

    socket.on("your-hand", (hand) => {
      myHand = hand;
      renderHand();
    });

    socket.on("game-state", (state) => {
      document.getElementById("roundDisp").textContent = state.round;
      document.getElementById("deckCount").textContent = state.deckCount;
      document.getElementById("startBtn").classList.add("hidden");
      document.getElementById("playArea").classList.remove("hidden");

      const isMyTurn = state.turnPlayerId === socket.id;
      const turnStatus = document.getElementById("turnStatus");

      if (state.discardTop) {
        document.getElementById("discardCard").innerHTML = `<span class="${state.discardTop.color}">${state.discardTop.value}${state.discardTop.suit}</span>`;
      } else {
        document.getElementById("discardCard").textContent = "-";
      }

      if (isMyTurn) {
        turnStatus.textContent = state.hasDrawn ? "🟢 دورك! حدد كرت وارمِه بالساحة" : "🟢 دورك! اسحب كرت";
      } else {
        turnStatus.textContent = `🔴 دور: ${state.turnPlayerName}`;
      }

      document.getElementById("deckPile").onclick = () => {
        if (isMyTurn && !state.hasDrawn) socket.emit("draw-card", { fromDiscard: false });
      };
      document.getElementById("discardPile").onclick = () => {
        if (isMyTurn && !state.hasDrawn) socket.emit("draw-card", { fromDiscard: true });
      };
    });

    function renderHand() {
      const tray = document.getElementById("handTray");
      tray.innerHTML = "";

      myHand.forEach((card) => {
        const div = document.createElement("div");
        div.className = `card ${card.color} ${selectedCardId === card.id ? 'selected' : ''}`;
        div.innerHTML = `<div>${card.value}</div><div>${card.suit}</div>`;
        
        div.onclick = () => {
          selectedCardId = (selectedCardId === card.id) ? null : card.id;
          renderHand();
          updateButtons();
        };

        tray.appendChild(div);
      });
    }

    function updateButtons() {
      const discardBtn = document.getElementById("discardBtn");
      const handWinBtn = document.getElementById("handWinBtn");

      if (selectedCardId) {
        discardBtn.classList.remove("hidden");
      } else {
        discardBtn.classList.add("hidden");
      }

      if (myHand.length === 14 || myHand.length === 15) {
        handWinBtn.classList.remove("hidden");
      } else {
        handWinBtn.classList.add("hidden");
      }
    }

    document.getElementById("discardBtn").onclick = () => {
      if (selectedCardId) {
        socket.emit("discard-card", { cardId: selectedCardId });
        selectedCardId = null;
        document.getElementById("discardBtn").classList.add("hidden");
      }
    };

    document.getElementById("handWinBtn").onclick = () => {
      socket.emit("declare-hand-win");
    };

    document.getElementById("sortGroupBtn").onclick = () => {
      myHand.sort((a, b) => a.value.localeCompare(b.value));
      renderHand();
    };

    document.getElementById("sortRunBtn").onclick = () => {
      myHand.sort((a, b) => a.suit.localeCompare(b.suit));
      renderHand();
    };

    socket.on("round-ended", (res) => {
      alert(`🎉 انتهت الجولة! الفائز: ${res.winnerName}`);
    });

    socket.on("game-over", () => {
      alert("🏆 انتهت الـ 5 جولات بالكامل!");
    });
  </script>
</body>
</html>
